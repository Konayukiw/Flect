name: Nightly AI Evals

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Anything new since the last run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "${{ github.repository }}" --workflow nightly-ai.yml \
                 --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "No commits since the last successful nightly run ($last)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ai:
    name: Subtitles and background removal
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FLECT_HOME: ${{ github.workspace }}\.flect-home
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pick cache keys
        id: keys
        shell: pwsh
        run: |
          "month=$(Get-Date -Format yyyy-MM)" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore third-party tools
        uses: actions/cache@v6
        with:
          path: dependencies
          key: deps-${{ hashFiles('scripts/fetch.ps1') }}-${{ steps.keys.outputs.month }}

      - name: Restore Python environment and models
        uses: actions/cache@v6
        with:
          path: |
            .flect-home/env
            .flect-home/models
          key: ai-${{ steps.keys.outputs.image }}-${{ hashFiles('deps/*.py', 'src/App/Main/Subtitles/SubtitleSupport.cs', 'src/App/Main/Image/BackgroundRemover.cs') }}

      - name: Fetch third-party tools
        shell: pwsh
        run: ./scripts/fetch.ps1

      - name: Run AI evals
        working-directory: evals
        shell: pwsh
        run: >
          dotnet test --project Evals/Evals.csproj -c Release
          --filter-trait "Category=AI"
          --report-xunit-trx --report-xunit-trx-filename ai.trx
          --results-directory "${{ runner.temp }}/ai-results"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-results
          path: ${{ runner.temp }}/ai-results
          retention-days: 14
