name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, sign, and attach
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Check the draft and SignPath settings
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Run Release on main. This run is $($env:GITHUB_REF)."
          }
          $missing = @(
            @($env:SIGNPATH_API_TOKEN, 'secret SIGNPATH_API_TOKEN'),
            @($env:SIGNPATH_ORGANIZATION_ID, 'variable SIGNPATH_ORGANIZATION_ID'),
            @($env:SIGNPATH_PROJECT_SLUG, 'variable SIGNPATH_PROJECT_SLUG'),
            @($env:SIGNPATH_SIGNING_POLICY_SLUG, 'variable SIGNPATH_SIGNING_POLICY_SLUG')
          ) | Where-Object { -not $_[0] } | ForEach-Object { $_[1] }
          if ($missing) { throw "Set $($missing -join ', ') before running Release." }

          . ./scripts/version.ps1
          [xml]$props = Get-Content Directory.Build.props
          $group = $props.Project.PropertyGroup | Where-Object { $_.BrandName } | Select-Object -First 1
          $display = Format-BrandDisplayVersion $group.BrandVersion
          $tag = '{0}-{1}' -f $group.BrandName.ToLowerInvariant(), $display
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish,body
          if ($LASTEXITCODE -ne 0) {
            throw "Create a draft release tagged $tag from .github/RELEASE_TEMPLATE.md and save it before running Release."
          }
          $view = $release | ConvertFrom-Json
          if (-not $view.isDraft) { throw "Release $tag is already published." }
          if ([string]::IsNullOrWhiteSpace($view.body)) {
            throw "Draft $tag has no release notes. Edit it from .github/RELEASE_TEMPLATE.md before running Release."
          }
          $target = "$($view.targetCommitish)"
          if (-not $target) { throw "Draft $tag has no target commit." }
          if ($target.StartsWith('refs/heads/')) { $target = $target.Substring('refs/heads/'.Length) }
          if ($target.StartsWith('refs/tags/')) { $target = $target.Substring('refs/tags/'.Length) }
          $resolved = if ($target -eq $env:GITHUB_SHA) { $env:GITHUB_SHA } else {
            gh api "repos/$env:GITHUB_REPOSITORY/commits/$target" --jq .sha
          }
          if ($LASTEXITCODE -ne 0 -or -not $resolved) { throw "Could not resolve draft target $target." }
          $resolved = "$resolved".Trim()
          if ($resolved.ToLowerInvariant() -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw "Draft $tag targets $resolved, but this run is $($env:GITHUB_SHA)."
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch third-party tools
        shell: pwsh
        run: ./scripts/fetch.ps1

      - name: Build shell extension and worker
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Pack unsigned binaries
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $brand = ($props.Project.PropertyGroup | Where-Object { $_.BrandName } | Select-Object -First 1).BrandName
          $names = @("$brand.exe", "$brand.dll", "${brand}Shell.dll")
          $directory = Join-Path $pwd 'signing'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $zipPath = Join-Path $directory 'flect-binaries.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Create')
          try {
            foreach ($name in $names) {
              $source = Join-Path dist $name
              if (-not (Test-Path -LiteralPath $source)) { throw "$source was not built." }
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $source, $name) | Out-Null
            }
          }
          finally { $zip.Dispose() }

      - name: Upload unsigned binaries
        id: unsigned-binaries
        uses: actions/upload-artifact@v7
        with:
          name: flect-binaries
          path: signing/flect-binaries.zip
          archive: false
          if-no-files-found: error

      - name: Sign binaries
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: flect-binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-binaries

      - name: Use the signed binaries
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $brand = ($props.Project.PropertyGroup | Where-Object { $_.BrandName } | Select-Object -First 1).BrandName
          foreach ($name in @("$brand.exe", "$brand.dll", "${brand}Shell.dll")) {
            $signed = Get-ChildItem signed-binaries -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $signed) { throw "Signed $name was not found." }
            $signature = Get-AuthenticodeSignature -LiteralPath $signed.FullName
            if ($signature.Status -ne 'Valid') { throw "$name signature status is $($signature.Status)." }
            Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path dist $name) -Force
          }

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Package installer
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload unsigned Setup
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: Flect-Setup.exe
          path: build/setup/Flect-Setup.exe
          archive: false
          if-no-files-found: error

      - name: Sign Setup
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: flect-setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
          skip-decompress: true

      - name: Attach signed Setup to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          . ./scripts/version.ps1
          [xml]$props = Get-Content Directory.Build.props
          $group = $props.Project.PropertyGroup | Where-Object { $_.BrandName } | Select-Object -First 1
          $brand = $group.BrandName
          $display = Format-BrandDisplayVersion $group.BrandVersion
          $tag = '{0}-{1}' -f $brand.ToLowerInvariant(), $display
          $setup = Join-Path signed-setup "$brand-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            $found = Get-ChildItem signed-setup -Recurse -File -Filter *.exe | Select-Object -First 1
            if (-not $found) { throw 'Signed Setup was not downloaded.' }
            Move-Item -LiteralPath $found.FullName -Destination $setup -Force
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid') { throw "Signed Setup status is $($signature.Status)." }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json id,isDraft
          if ($LASTEXITCODE -ne 0) { throw "Draft release $tag was not found." }
          $view = $release | ConvertFrom-Json
          if (-not $view.isDraft) { throw "Release $tag is already published." }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($view.id)" -f "name=$brand $display"
          if ($LASTEXITCODE -ne 0) { throw "Setting the title of $tag to $brand $display failed." }
          gh release upload $tag $setup --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Uploading $brand-Setup.exe to $tag failed." }
